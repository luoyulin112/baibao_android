name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 发布 Release（含诊断日志）需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk build-essential \
            python3-pip autoconf automake libtool libtool-bin libltdl-dev gettext pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev xz-utils

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.33"

      - name: Validate (logic self-test)
        # 只跑纯逻辑自测（不依赖 kivy）。main 的 kivy import 校验
        # 留给 buildozer android debug 阶段，编译期会自动暴露。
        run: python selftest.py

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (debug)
        env:
          # 避免交互式提示
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -eo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$PATH:~/.local/bin
          # 强制 aclocal 找到 libtool 宏：libffi (LIBFFI_ENABLE_SYMVERS) 会触发 LT_SYS_SYMBOL_USCORE
          # Ubuntu 24.04 上该宏依赖 libtool-bin / libltdl-dev 提供，这里兜底把 /usr/share/aclocal 置入搜索路径
          export ACLOCAL_PATH="$(aclocal --print-ac-dir 2>/dev/null):/usr/share/aclocal:/usr/share/aclocal-1.16"
          export SDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          : > build.log

          # 第一次构建：触发 cmdline-tools/SDK 结构下载（license 处失败，忽略）
          python -m buildozer android debug >> build.log 2>&1 || true

          # 定位 buildozer 实际使用的 sdkmanager（优先 tools/bin）
          SDKMANAGER="$SDK/tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "USING sdkmanager = ${SDKMANAGER:-NOT FOUND}" | tee -a build.log

          # 关键：必须显式 --sdk_root，否则新版 sdkmanager 会把 license 写到别处，
          # 而 buildozer 内部用 --sdk_root=$SDK 去读，两边不一致→判定未接受
          echo "=== accept all licenses ===" | tee -a build.log
          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK" 2>&1 | tee -a build.log || true
          echo "=== licenses dir after accept ===" | tee -a build.log
          ls -la "$SDK/licenses" 2>/dev/null | tee -a build.log || echo "licenses dir MISSING" | tee -a build.log

          # 预装所需包（license 已接受，不会再弹交互提示）
          echo "=== preinstall packages ===" | tee -a build.log
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>&1 | tee -a build.log || true

          # 真正编译
          echo "=== real build ===" | tee -a build.log
          python -m buildozer -v android debug 2>&1 | tee -a build.log
          echo "=== bin/ ===" | tee -a build.log
          ls -la bin/ 2>/dev/null | tee -a build.log || echo "bin/ NOT FOUND" | tee -a build.log
          find . -name '*.apk' 2>/dev/null | tee -a build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: baibao-android-apk
          path: "**/*.apk"
          if-no-files-found: warn

      # 自动发布到 Release（固定 tag=apk，覆盖更新），方便国内走镜像下载
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: Baibao Debug APK
          files: "**/*.apk"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建失败时把编译日志作为公开资产发布，便于定位（无需认证的下载链接）
      - name: Publish diagnostic log (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag
          name: Build diagnostics
          files: build.log
          overwrite: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
