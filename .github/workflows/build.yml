name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 发布 Release（含诊断日志）需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Heal & pin pip
        run: |
          set -e
          # 1) ensurepip 从 Python 内置 wheel 重新提取一份自洽的 pip，不依赖当前
          #    可能已被半升级损坏的 pip（直接 `python -m pip` 都可能 import 失败）。
          python -m ensurepip --upgrade
          # 2) 锁定 pip==23.3.2：其 vendored 的 resolvelib(1.0.1) 仍导出
          #    RequirementInformation，而 p4a 引导 venv 时依赖该符号。新版 pip
          #    (>=24.1) 把该符号从 struct 里删了，会导致 `pip install -U pip` 自身
          #    ImportError，整包构建直接挂掉。venv 继承这份健康 pip 即可。
          python -m pip install --upgrade --force-reinstall --no-cache-dir "pip==23.3.2"
          python -m pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk build-essential \
            python3-pip autoconf automake libtool libtool-bin libltdl-dev gettext pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev xz-utils

      - name: Install Buildozer
        run: |
          set -e
          python -m pip install buildozer "cython==0.29.33"
          # 安装 buildozer 可能顺带改动 pip，再次锁定确保后续 venv 继承健康 pip。
          python -m pip install --upgrade --force-reinstall --no-cache-dir "pip==23.3.2"

      - name: Validate (logic self-test)
        # 只跑纯逻辑自测（不依赖 kivy）。main 的 kivy import 校验
        # 留给 buildozer android debug 阶段，编译期会自动暴露。
        run: python selftest.py

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK (debug)
        env:
          # 避免交互式提示
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -eo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$PATH:~/.local/bin
          # 强制 aclocal 找到 libtool 宏：libffi (LIBFFI_ENABLE_SYMVERS) 会触发 LT_SYS_SYMBOL_USCORE。
          # aclocal 失败时兜底到默认路径；用 || echo 避免 set -e 在命令替换失败时退出。
          ACLOCAL_DIR=$(aclocal --print-ac-dir 2>/dev/null || echo /usr/share/aclocal)
          export ACLOCAL_PATH="$ACLOCAL_DIR:/usr/share/aclocal:/usr/share/aclocal-1.16"
          export SDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          : > build.log

          # 手动接受 license（SDK 已存在时有意义；cache miss 时 SDK 目录不存在则跳过）。
          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          echo "USING sdkmanager = ${SDKMANAGER:-NOT FOUND}" | tee -a build.log
          if [ -n "$SDKMANAGER" ]; then
            echo "=== accept all licenses (pre-buildozer) ===" | tee -a build.log
            yes | "$SDKMANAGER" --licenses --sdk_root="$SDK" 2>&1 | tee -a build.log || true
            echo "=== preinstall packages ===" | tee -a build.log
            "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>&1 | tee -a build.log || true
          fi

          # 第一次构建：让 buildozer 克隆 p4a 并解出/编译所有 recipe 源码（耗时最长）。
          # 这一步会在 p4a 的 `pip install -U pip` 处失败（已用 || true 兜底），但 p4a
          # 目录已经就位、recipe 也已编译完成，第二次构建可直接复用。
          echo "=== first build (clone p4a + compile recipes; pip step expected to fail) ===" | tee -a build.log
          yes | python -m buildozer android debug 2>&1 | tee -a build.log || true

          # 克隆出 p4a 后，把强制升级 pip 的所有写法都 sed 成 no-op(true)。
          # 用正则匹配，不依赖引号风格（旧写法 "source venv/bin/activate && pip install -U pip"
          # 用双引号 sed 匹配不到单引号源码，所以之前没生效）。
          P4A_DIR=$(find . -type d -name python-for-android -path '*.buildozer*' 2>/dev/null | head -1 || true)
          echo "P4A_DIR=${P4A_DIR:-NOT FOUND}" | tee -a build.log
          if [ -n "$P4A_DIR" ]; then
            BUILD_PY="$P4A_DIR/pythonforandroid/build.py"
            echo "=== patch p4a: neutralize ALL forced pip self-upgrades ===" | tee -a build.log
            find "$P4A_DIR" -name '*.py' -print0 | xargs -0 sed -i -E 's/(pip3?|python[0-9]* -m pip)[[:space:]]+install[[:space:]]+(-U|--upgrade)[[:space:]]+pip/true/g'
            echo "remaining forced pip-upgrade occurrences: $(grep -rcE '(pip3?|python[0-9]* -m pip)[[:space:]]+install[[:space:]]+(-U|--upgrade)[[:space:]]+pip' "$P4A_DIR" 2>/dev/null | grep -v ':0' | head || true)" | tee -a build.log

            echo "=== patch p4a: build run_pymodules_install venv with build-machine python ===" | tee -a build.log
            # root cause: run_pymodules_install uses the cross-built host_python to run
            #   `host_python -m venv venv`
            # but hostpython3(desktop) stdlib lacks a runnable venv.__main__ ->
            #   "No module named venv.__main__". That venv only installs pure-python
            # deps (certifi/requests/...) into the android site-packages, so creating
            # it with the build-machine python (sys.executable, full venv) is correct;
            # --clear keeps it idempotent across rebuilds.
            sed -i -E "s/shprint(host_python, '-m', 'venv', 'venv')/shprint(sh.Command(sys.executable), '-m', 'venv', '--clear', 'venv')/" "$BUILD_PY"
            grep -q "sh.Command(sys.executable)" "$BUILD_PY" || { echo "PATCH FAILED: venv-creation line not patched"; exit 1; }
            echo "venv-creation patched: $(grep -n "sys.executable" "$BUILD_PY" | head -1)" | tee -a build.log
            # 再次锁定 host pip，防止第一次构建里 recipe 编译阶段把它顶到坏版本。
            python -m pip install --upgrade --force-reinstall --no-cache-dir "pip==23.3.2"

            # 修复 AAB 版本门槛误报：p4a 是从 git 克隆的（未被 pip 安装），其
            # __version__ 会回退成 "0.0.0"，导致 buildozer 的 AAB 支持门槛
            # (< 2023.08.09) 误判 p4a 太旧而直接中止（所有 recipe 其实都已编译
            # 成功，唯独最后的 toolchain aab 探针被拦）。这里先把 tag 拉下来让
            # setuptools_scm/git-describe 能算出真实版本，再把静态回退值直接写成
            # 带 AAB 支持的 2026.5.9 作为兜底，确保 buildozer 放行。
            git -C "$P4A_DIR" fetch --tags --depth 1 2>/dev/null || true
            sed -i -E 's/^([[:space:]]*)__version__[[:space:]]*=[[:space:]]*.*/\1__version__ = "2026.5.9"/' "$P4A_DIR/pythonforandroid/__init__.py"
            echo "p4a __version__ now: $(grep -E '__version__' "$P4A_DIR/pythonforandroid/__init__.py" | head -1)" | tee -a build.log
          fi

          # 真正编译 + 打包（p4a 已 patch，pip 健康）。recipe 在第一次已编译，这里复用。
          echo "=== real build ===" | tee -a build.log
          yes | python -m buildozer -v android debug 2>&1 | tee -a build.log
          echo "=== bin/ ===" | tee -a build.log
          ls -la bin/ 2>/dev/null | tee -a build.log || echo "bin/ NOT FOUND" | tee -a build.log
          find . -name '*.apk' 2>/dev/null | tee -a build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: baibao-android-apk
          path: "**/*.apk"
          if-no-files-found: warn

      # 自动发布到 Release（固定 tag=apk，覆盖更新），方便国内走镜像下载
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: Baibao Debug APK
          files: "**/*.apk"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建失败时把编译日志作为公开资产发布，便于定位（无需认证的下载链接）
      - name: Publish diagnostic log (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag
          name: Build diagnostics
          files: build.log
          overwrite_files: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
