name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 发布 Release（含诊断日志）需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Heal & pin pip
        run: |
          set -e
          # ensurepip 从 Python 内置 wheel 重新提取一份自洽的 pip（不依赖可能被
          # 半升级损坏的当前 pip），随后锁定到 23.3.2。这只是宿主 pip，真正决定
          # 构建成败的是 p4a 引导 venv 里的 pip——那一步已在 p4a fork 里锁到 23.3.2。
          python -m ensurepip --upgrade
          python -m pip install --upgrade --force-reinstall --no-cache-dir "pip==23.3.2"
          python -m pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk build-essential \
            python3-pip autoconf automake libtool libtool-bin libltdl-dev gettext pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev xz-utils

      - name: Install Buildozer
        run: |
          set -e
          python -m pip install buildozer "cython==0.29.33"
          python -m pip install --upgrade --force-reinstall --no-cache-dir "pip==23.3.2"

      - name: Validate (logic self-test)
        # 只跑纯逻辑自测（不依赖 kivy）。main 的 kivy import 校验
        # 留给 buildozer android debug 阶段，编译期会自动暴露。
        run: python selftest.py

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK (debug)
        env:
          # 避免交互式提示
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -eo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$PATH:~/.local/bin
          # 强制 aclocal 找到 libtool 宏：libffi (LIBFFI_ENABLE_SYMVERS) 会触发 LT_SYS_SYMBOL_USCORE。
          # aclocal 失败时兜底到默认路径；用 || echo 避免 set -e 在命令替换失败时退出。
          ACLOCAL_DIR=$(aclocal --print-ac-dir 2>/dev/null || echo /usr/share/aclocal)
          export ACLOCAL_PATH="$ACLOCAL_DIR:/usr/share/aclocal:/usr/share/aclocal-1.16"
          export SDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          : > build.log

          # 手动接受 license（SDK 已存在时有意义；cache miss 时 SDK 目录不存在则跳过）。
          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          echo "USING sdkmanager = ${SDKMANAGER:-NOT FOUND}" | tee -a build.log
          if [ -n "$SDKMANAGER" ]; then
            echo "=== accept all licenses (pre-buildozer) ===" | tee -a build.log
            yes | "$SDKMANAGER" --licenses --sdk_root="$SDK" 2>&1 | tee -a build.log || true
            echo "=== preinstall packages ===" | tee -a build.log
            "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>&1 | tee -a build.log || true
          fi

          # 单次干净构建：p4a fork 已把致命的 `pip install -U pip` 改为锁定 pip==23.3.2，
          # 不再需要在构建脚本里 sed 改 p4a 源码（buildozer 每次构建都会 git 复位 p4a，
          # 之前的 sed 补丁必然被撤销，这正是连续多次构建都失败的根因）。
          echo "=== build (p4a fork neutralizes the fatal pip self-upgrade) ===" | tee -a build.log
          # 关闭 bionic FORTIFY：NDK r25+ 默认 _FORTIFY_SOURCE=2，SDL2 对已销毁 mutex 上锁会被
          # 拦截成 SIGABRT 启动崩溃。p4a 用 CMake 编译 SDL2（不走 ndk-build 的 Application.mk 方式），
          # 因此必须把开关经 CFLAGS/CXXFLAGS/CPPFLAGS 与 android.add_compile_options 两条路都注入，
          # 确保真正进到 SDL2 的编译命令行（之前改 Application.mk 的 patch 是假生效，已移除）。
          # 限制并行编译，压低内存峰值，避免免费 runner 被 OOM 杀掉
          export MAKEFLAGS="-j2"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export CFLAGS="${CFLAGS:-} -D_FORTIFY_SOURCE=0"
          export CXXFLAGS="${CXXFLAGS:-} -D_FORTIFY_SOURCE=0"
          export CPPFLAGS="${CPPFLAGS:-} -D_FORTIFY_SOURCE=0"
          echo "=== build (disable bionic FORTIFY via flags + add_compile_options) ===" | tee -a build.log
          set +o pipefail
          yes | python -m buildozer -v android debug 2>&1 | tee -a build.log
          BUILD_RC=${PIPESTATUS[1]}
          set -o pipefail
          echo "=== buildozer exit code: $BUILD_RC ===" | tee -a build.log
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "!!! buildozer failed with rc=$BUILD_RC" | tee -a build.log
            exit "$BUILD_RC"
          fi
          echo "=== bin/ ===" | tee -a build.log
          ls -la bin/ 2>/dev/null | tee -a build.log || echo "bin/ NOT FOUND" | tee -a build.log
          find . -name '*.apk' 2>/dev/null | tee -a build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: baibao-android-apk
          path: "**/*.apk"
          if-no-files-found: warn

      # 自动发布到 Release（固定 tag=apk，覆盖更新），方便国内走镜像下载
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: Baibao Debug APK
          files: "**/*.apk"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建失败时把编译日志作为公开资产发布，便于定位（无需认证的下载链接）
      - name: Publish diagnostic log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag
          name: Build diagnostics
          files: build.log
          overwrite_files: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
