name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.33"

      - name: Validate (logic self-test + kivy import)
        run: |
          pip install kivy
          python selftest.py
          python -c "import main; print('import main OK')"

      - name: Build APK (debug)
        run: buildozer android debug
        env:
          # 避免交互式提示
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baibao-android-apk
          path: bin/*.apk
          if-no-files-found: error

      # 自动发布到 Release（固定 tag=apk，覆盖更新），方便国内走镜像下载
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: Baibao Debug APK
          files: bin/*.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
